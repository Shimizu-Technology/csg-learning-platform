# Historical Solid Queue schedules, only for an intentionally restored worker.
# Current inline production uses bin/rails scheduled:tick on Render cron.
# Never enable both schedulers; see docs/DEPLOYMENT.md before worker recovery.
production:
  message_delivery_recovery:
    class: MessageDeliveryRecoveryJob
    schedule: every minute
  intervention_follow_ups:
    class: InterventionFollowUpJob
    schedule: every day at 8am <%= Rails.application.config.x.school.time_zone %>
  expo_push_receipt_sweep:
    class: ExpoPushReceiptJob
    schedule: every 15 minutes
    description: Recover due Expo push receipts if their original delayed job could not be enqueued.
