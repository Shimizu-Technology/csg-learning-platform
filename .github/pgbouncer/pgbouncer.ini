; Disposable CI credentials only. Never use this trust-auth config in production.
[databases]
csg_learning_platform_test = host=127.0.0.1 port=5432 dbname=csg_learning_platform_test user=postgres password=postgres

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = trust
auth_file = ../.github/pgbouncer/userlist.txt
pool_mode = transaction
server_round_robin = 1
default_pool_size = 2
min_pool_size = 2
reserve_pool_size = 0
max_client_conn = 100
logfile = /tmp/csg-ci-pgbouncer.log
pidfile = /tmp/csg-ci-pgbouncer.pid
