name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: ./api

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      run_full: ${{ steps.filter.outputs.run_full }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # PR checkout is the merge commit; compare against its first parent.
          fetch-depth: 2
      - name: Verify docs-only classifier
        run: python3 .github/scripts/test-ci-docs-only.py
      - name: Classify changes (fail open)
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 .github/scripts/ci-docs-only.py HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 .github/scripts/ci-docs-only.py "$BEFORE" HEAD >> "$GITHUB_OUTPUT"
          else
            echo 'run_full=true' >> "$GITHUB_OUTPUT"
          fi

  production_health_monitor:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Test production health monitor
        run: node --test scripts/production-health-check.test.mjs

  scan_ruby:
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    # Ruby 3.3.7 has a prebuilt toolchain on this pinned runner image.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler-cache: true
          working-directory: ./api

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    # Ruby 3.3.7 has a prebuilt toolchain on this pinned runner image.
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: ${{ github.workspace }}/api/tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler-cache: true
          working-directory: ./api

      - name: Prepare RuboCop cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('api/.ruby-version', 'api/**/.rubocop.yml', 'api/**/.rubocop_todo.yml', 'api/Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    # Ruby 3.3.7 has a prebuilt toolchain on this pinned runner image.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/csg_learning_platform_test

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler-cache: true
          working-directory: ./api

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Run tests with OpenAPI response validation and coverage
        env:
          PARALLEL_WORKERS: 1
          OPENAPI_COVERAGE: 1
        run: bin/rails test

  test_pooler:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    name: API / transaction pooler (${{ matrix.prepared }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - prepared: false
            max_prepared: 0
          - prepared: true
            max_prepared: 100
    timeout-minutes: 15
    # Ruby 3.3.7 has a prebuilt toolchain on this pinned runner image.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      # Avoid Rails parallel database creation/schema preparation via the pooler.
      PARALLEL_WORKERS: 1
      POOLER_CANARY: "1"
      POOLER_DIRECT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/csg_learning_platform_test
      EXPECTED_PREPARED_STATEMENTS: ${{ matrix.prepared }}
      EXPECTED_MAX_PREPARED: ${{ matrix.max_prepared }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:16432/csg_learning_platform_test?prepared_statements=${{ matrix.prepared }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          bundler-cache: true
          working-directory: ./api

      - name: Set up database directly
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/csg_learning_platform_test
        run: bin/rails db:create db:schema:load

      - name: Start transaction pooler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pgbouncer
          sed "s|auth_file = .*|auth_file = $GITHUB_WORKSPACE/.github/pgbouncer/userlist.txt|" ../.github/pgbouncer/pgbouncer.ini > /tmp/csg-ci-pgbouncer.ini
          echo "max_prepared_statements = ${{ matrix.max_prepared }}" >> /tmp/csg-ci-pgbouncer.ini
          pgbouncer -d /tmp/csg-ci-pgbouncer.ini
          for attempt in {1..30}; do
            if [ -s /tmp/csg-ci-pgbouncer.pid ] && pg_isready -h 127.0.0.1 -p 16432 -U postgres -d csg_learning_platform_test; then
              exit 0
            fi
            sleep 1
          done
          { grep -v 'command issued' /tmp/csg-ci-pgbouncer.log || true; } | tail -n 80
          exit 1

      - name: Verify pooled connection and run full API suite
        run: |
          bundle exec ruby ../.github/pgbouncer/verify.rb
          bin/rails runner 'config = ActiveRecord::Base.connection_db_config; abort "tests must use PgBouncer" unless config.configuration_hash[:port] == 16432; abort "wrong prepared statement mode" unless ActiveRecord::Base.connection.prepared_statements == (ENV.fetch("EXPECTED_PREPARED_STATEMENTS") == "true")'
          bin/rails test test/config/transaction_pooler_canary_test.rb
          time bin/rails test
          if [ "$EXPECTED_PREPARED_STATEMENTS" = "false" ]; then
            if grep -Ei 'command issued: (RECONNECT|WAIT_CLOSE)' /tmp/csg-ci-pgbouncer.log; then
              echo "::error::Unprepared migration tests must remain on the pooler"
              exit 1
            fi
            echo "Verified unprepared migrations stayed pooled without direct-connection resets"
          fi

      - name: Pooler diagnostics and cleanup
        if: always()
        run: |
          if [ -f /tmp/csg-ci-pgbouncer.pid ]; then
            kill "$(cat /tmp/csg-ci-pgbouncer.pid)"
          fi
          if [ -f /tmp/csg-ci-pgbouncer.log ]; then
            { grep -v 'command issued' /tmp/csg-ci-pgbouncer.log || true; } | tail -n 80
          fi

  frontend:
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated API types (including mobile twin)
        run: npm run api:check

      - name: Audit frontend dependencies
        run: npm run audit:dependencies

      - name: Lint, typecheck, test, and build frontend
        run: npm run check

      - name: Cache Playwright Chromium
        if: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}

      # Always install OS dependencies; the browser download is reused on cache hits.
      - name: Install Playwright Chromium
        if: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run public browser and accessibility tests
        if: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY != '' }}
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run test:e2e

      - name: Report missing browser-test configuration
        if: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY == '' }}
        run: echo "::notice::Set the VITE_CLERK_PUBLISHABLE_KEY repository variable to enable Playwright accessibility tests in CI."

  mobile:
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Audit mobile dependencies
        run: npm run audit:dependencies

      - name: Validate Expo dependency versions
        run: npx expo install --check

      - name: Lint, typecheck, and test mobile client
        run: npm run check

      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir /tmp/csg-mobile-ios-export

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/csg-mobile-android-export
