name: Production Health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  check:
    name: API health and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Test the monitor
        run: node --test scripts/production-health-check.test.mjs

      - name: Check production
        env:
          HEALTH_URL: https://csg-learn-api.onrender.com/health
          READINESS_URL: https://csg-learn-api.onrender.com/api/v1/ready
          EXPECTED_QUEUE_STATUS: not_required
        run: node scripts/production-health-check.mjs
