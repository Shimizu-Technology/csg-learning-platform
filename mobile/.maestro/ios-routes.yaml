appId: com.codeschoolofguam.connect
name: CSG Connect iOS route audit
tags:
  - routes
  - ios
---
- launchApp
- openLink: ${CSG_DEVELOPMENT_URL}
- tapOn:
    text: "Open"
    optional: true
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          point: "50%,22%"
- extendedWaitUntil:
    visible: "Needs attention"
    timeout: 60000
- assertVisible: "Updates, tab, 4 of 5"

- openLink: "csgconnect://learn"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Learning operations"
    timeout: 15000

- openLink: "csgconnect://staff/student/18"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Maya Santos"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Open safe restart controls for Maya Santos"
    direction: DOWN
    timeout: 15000

- openLink: "csgconnect://staff/grading"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Grading queue"
    timeout: 15000

- openLink: "csgconnect://staff/submission/31"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "QUICK REVIEW"
    timeout: 15000
- assertVisible: "Maya Santos"
- assertVisible: "Build a responsive card grid and deploy it."
- assertVisible: "Use CSS Grid."
- assertNotVisible: "<p>"

- openLink: "csgconnect://recordings"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Pick up where you left off"
    timeout: 15000

- openLink: "csgconnect://recordings/upload"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Upload recording"
    timeout: 15000
- assertVisible: "Upload directly to CSG"

- openLink: "csgconnect://resources"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Everything useful, close at hand."
    timeout: 15000

- openLink: "csgconnect://module/10"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Frontend Foundations"
    timeout: 15000
- assertVisible: "LESSONS"

- openLink: "csgconnect://lesson/101"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Responsive layouts with Grid"
    timeout: 15000

- openLink: "csgconnect://recording/uploaded-2"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "APIs, authentication, and deployment"
    timeout: 15000

- openLink: "csgconnect://messages"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Open Maya Santos"
    timeout: 15000
- assertVisible: "Open general"

- openLink: "csgconnect://conversation/channel/12"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Message composer.*"
    timeout: 15000
- assertVisible: "Command recap"
- assertVisible: "ls - list.*"
- assertVisible: "Copy code"
- assertVisible: "Code continues horizontally. Drag to read more."
- swipe:
    start: "85%,68%"
    end: "30%,68%"
    duration: 700
- assertVisible: ".*END-OF-LONG-LINE.*"
- tapOn: "Copy code"
- assertVisible: "Code copied"
- assertVisible: "Tab completion saves time."
- assertNotVisible: ".*```.*"

- openLink: "csgconnect://thread/101?kind=channel&conversationId=12&workspaceId=1"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "REPLIES"
    timeout: 15000

- openLink: "csgconnect://compose"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Who do you want to message?"
    timeout: 15000

- openLink: "csgconnect://search"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Search across CSG"
    timeout: 15000

- openLink: "csgconnect://updates"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "WHAT MATTERS NOW"
    timeout: 15000
- tapOn: "Announcements"
- assertVisible: "Open announcement: Office hours moved to Thursday"
- tapOn: "Inbox"
- assertVisible: "Maya Santos submitted Responsive card grid"
- assertVisible: "Responsive layouts with Grid · Attempt 2"
- tapOn: "Maya Santos submitted Responsive card grid"
- extendedWaitUntil:
    visible: "QUICK REVIEW"
    timeout: 15000
- assertVisible: "Open Maya Santos's student health"
- assertVisible: "Message Maya Santos in Web Dev Cohort 4"
- tapOn: "Back"
- assertNotVisible: "Loading updates"
- assertVisible: "Maya Santos submitted Responsive card grid"
- tapOn: "Maya Santos"
- extendedWaitUntil:
    visible: "Message composer.*"
    timeout: 15000
- assertVisible: "Can I send you the repo before office hours?"

- openLink: "csgconnect://profile"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "YOUR ACCOUNT"
    timeout: 15000

- openLink: "csgconnect://manage-communications"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Communication settings"
    timeout: 15000
- assertVisible: "CHANNELS"
