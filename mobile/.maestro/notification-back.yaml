appId: com.codeschoolofguam.connect
name: Cold notification-like deep link keeps Back and tabs
tags:
  - student
  - ios
  - notification
---
# Run on an installed synthetic/demo development build after onboarding.
# This checks cold linking, not OS push delivery (which still needs a device tap).
- stopApp
- openLink: "csgconnect:///lesson/100"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "HTML and semantic structure"
    timeout: 60000
- tapOn: "Back to Learn"
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- assertVisible: "Messages"
- assertVisible: "Learn"
