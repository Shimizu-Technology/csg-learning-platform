<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>%%productName%% · %%schoolName%%</title>
    <meta name="title" content="%%productName%% · %%schoolName%%" />
    <meta name="description" content="%%productName%% is %%schoolName%%'s learning workspace: lessons, code feedback, class recordings, and messages with your instructor." />
    <meta name="keywords" content="coding bootcamp, learn to code, guam, programming, web development, code school" />
    <meta name="author" content="%%schoolName%%" />
    <link rel="canonical" href="%%appUrl%%/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%%appUrl%%/" />
    <meta property="og:title" content="%%productName%% · %%schoolName%%" />
    <meta property="og:description" content="%%productName%% is %%schoolName%%'s learning workspace: lessons, code feedback, class recordings, and messages with your instructor." />
    <meta property="og:image" content="%%appUrl%%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%%appUrl%%/" />
    <meta property="twitter:title" content="%%productName%% · %%schoolName%%" />
    <meta property="twitter:description" content="%%productName%% is %%schoolName%%'s learning workspace: lessons, code feedback, class recordings, and messages with your instructor." />
    <meta property="twitter:image" content="%%appUrl%%/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme and browser chrome -->
    <!-- Light or dark comes from the saved choice (Light / Dark / System, see
         src/lib/theme.ts), resolved here before the bundle loads so the first
         paint never flashes the other theme. The status bar is cream on public
         and sign-in pages (matches %%siteHost%%) and the header colour
         elsewhere, in each theme; lib/brand.ts applySurface() and lib/theme.ts
         keep both in step afterwards. Newsreader is deliberately not preloaded:
         on slow connections the preload competed with the app's JavaScript and
         delayed the first headline (font-display: swap instead). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        var root = document.documentElement;
        // Keep in sync with surfaceForPath() in src/lib/brand.ts (asserted in brand.test.ts).
        var PUBLIC_SURFACE = /^\/((sign-in|sign-up|courses|privacy|terms|account-deletion)(\/.*)?)?$/;
        var isPublic = PUBLIC_SURFACE.test(location.pathname);
        root.setAttribute('data-surface', isPublic ? 'public' : 'app');
        // Keep in sync with readThemePreference() and THEME_COLORS in src/lib/theme.ts (asserted in theme.test.ts).
        var preference = 'system';
        try {
          var stored = window.localStorage.getItem('csg-learn:theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch (e) {}
        var systemDark = false;
        try { systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        var dark = preference === 'dark' || (preference === 'system' && systemDark);
        var theme = dark ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute('content', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isPublic ? (dark ? '#11100d' : '#faf7f0') : (dark ? '#151a22' : '#ffffff'));
      })();
    </script>
    <style>
      /* Shown until the app mounts, so a slow connection never shows a blank page. */
      html { background: #f8f7f4; }
      html[data-surface="public"] { background: #faf7f0; }
      html[data-theme="dark"] { background: #0c0f14; }
      html[data-theme="dark"][data-surface="public"] { background: #11100d; }
      #boot-shell { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; padding: 2rem 1rem; text-align: center; color: #0f172a; font-family: "Manrope Variable", "Avenir Next", system-ui, sans-serif; }
      #boot-shell img { width: 48px; height: 48px; border-radius: 6px; }
      #boot-shell .boot-name { margin: 0; font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; }
      #boot-shell .boot-sub { margin: 0; font-size: 0.875rem; color: #475569; }
      #boot-shell .boot-slow { max-width: 22rem; margin: 1rem 0 0; font-size: 0.875rem; line-height: 1.5; color: #475569; }
      #boot-shell .boot-slow[hidden] { display: none; }
      #boot-shell button { min-height: 44px; margin-top: 0.75rem; padding: 0 1.25rem; border: 0; border-radius: 6px; background: #9c292b; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      #boot-shell button:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
      html[data-theme="dark"] #boot-shell { color: #e8ecf2; }
      html[data-theme="dark"] #boot-shell :is(.boot-sub, .boot-slow) { color: #b4bdca; }
      html[data-theme="dark"] #boot-shell button { background: #b23e40; }
      html[data-theme="dark"] #boot-shell button:focus-visible { outline-color: #6ea8ff; }
    </style>
    <meta name="msapplication-TileColor" content="#9c292b" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%%productName%%" />
    <link rel="apple-touch-icon" href="/icon-180x180.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "%%schoolName%%",
      "url": "%%appUrl%%",
      "description": "%%schoolName%%'s learning workspace for enrolled learners.",
      "areaServed": {
        "@type": "Place",
        "name": "Guam"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "%%productName%%",
      "url": "%%appUrl%%"
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell" role="status" aria-live="polite">
        <img src="%%logoSrc%%" alt="" width="48" height="48" />
        <p class="boot-name">%%productName%%</p>
        <p class="boot-sub">%%schoolName%%</p>
        <p id="boot-slow" class="boot-slow" hidden>
          Still loading. Check your connection, then try again.<br />
          <button type="button" onclick="window.location.reload()">Reload</button>
        </p>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var slow = document.getElementById('boot-slow');
        if (slow) slow.hidden = false;
      }, 8000);
    </script>
    <noscript><p style="padding:1rem;text-align:center;font-family:system-ui,sans-serif">%%productName%% needs JavaScript. For help, email %%supportEmail%%.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
